# 受注入力の画面（フレームワーク**無し**版）。
#
# hatake は入れない。入るのは Flutter と `http` だけ ── 画面は全部手で組む。
name: order_entry_app_no_framework
description: 受注入力（フレームワーク無し版・比べるためのもの）。
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.5.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  # グラフは自分で描くと大仕事なので、素直に借りる
  # （hatake 版では `chart:` を1行書くだけだった所）。
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
