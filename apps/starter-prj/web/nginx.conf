# 画面と定義を配る。
#
# 定義（/definitions/）は**手元のフォルダをそのまま**見せている（docker-compose.yml の
# volumes）。書き換えたら再読み込みするだけで画面が変わるように、覚えさせない。
server {
  listen 80;
  root /usr/share/nginx/html;

  location /definitions/ {
    add_header Cache-Control "no-store";
  }

  # 1枚の index.html に集約する（道はアプリが持つ）。
  location / {
    try_files $uri $uri/ /index.html;
  }
}
