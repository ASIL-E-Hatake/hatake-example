# 機能網羅を丸ごと動かす。
#
#   docker compose up
#
# DB は要りません（API は決め打ちの値を返すモック）。
# 1本目・2本目と**同時に上げられる**ように口を分けてあります。
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3003:3000"
    volumes:
      # 定義は焼き込まない。**動かしている間はここを見る**。
      - ./definitions:/app/definitions:ro
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8083:80"
    depends_on:
      - api
  # **同じ定義を Vue で描いた版。** 画面のコードは1行も書いていない側も、
  # 描く先が変わっただけで同じものが出ることを、並べて見るために上げる。
  web-vue:
    build:
      context: .
      dockerfile: docker/web-vue.Dockerfile
    ports:
      - "8084:80"
    depends_on:
      - api
  # **同じ定義を React で描いた版。** Vue 版と並べると、案件が書く4つ
  # （定義の読み先・Repository の道・plugin の中身・出す口）が同じまま、
  # 描く側だけ差し替わっていることが見える。
  web-react:
    build:
      context: .
      dockerfile: docker/web-react.Dockerfile
    ports:
      - "8085:80"
    depends_on:
      - api
