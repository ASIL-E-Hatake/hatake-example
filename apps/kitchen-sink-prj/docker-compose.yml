# 機能網羅を丸ごと動かす。
#
#   docker compose up
#
# DB は要りません（API は決め打ちの値を返すモック）。
# 1本目・2本目と**同時に上げられる**ように口を分けてあります。
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3003:3000"
    volumes:
      # 定義は焼き込まない。**動かしている間はここを見る**。
      - ./definitions:/app/definitions:ro
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8083:80"
    depends_on:
      - api
