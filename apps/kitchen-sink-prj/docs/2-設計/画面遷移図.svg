<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 684" width="900" height="684" role="img" aria-label="機能網羅（kitchen_sink）の画面と遷移">
  <style>
    .bg { fill: #ffffff }
    text { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #0f172a }
    .title { font-size: 19px; font-weight: 700 }
    .caption { font-size: 13px; fill: #64748b }
    .label { font-size: 15px; font-weight: 600 }
    .note { font-size: 13px; fill: #64748b }
    .body { font-size: 13px; fill: #334155 }
    .edge { font-size: 13px; fill: #475569 }
    .strong { font-weight: 700 }
    .good { fill: #15803d }
    .bad { fill: #b91c1c }
    .box { stroke-width: 1.5 }
    .core { fill: #f1f5f9; stroke: #475569 }
    .input { fill: #eff6ff; stroke: #2563eb }
    .output { fill: #f0fdf4; stroke: #16a34a }
    .outside { fill: #fefce8; stroke: #ca8a04; stroke-dasharray: 5 4 }
    .warn { fill: #fef2f2; stroke: #dc2626 }
    .flow { stroke: #475569; stroke-width: 2 }
    .link { fill: none; stroke-width: 1.6 }
    .back { stroke: #94a3b8 }
    .tip { fill: #475569 }
    .tipBack { fill: #94a3b8 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220 }
      text { fill: #e2e8f0 }
      .caption, .note { fill: #94a3b8 }
      .body { fill: #cbd5e1 }
      .edge { fill: #cbd5e1 }
      .good { fill: #4ade80 }
      .bad { fill: #f87171 }
      .core { fill: #172033; stroke: #94a3b8 }
      .input { fill: #172554; stroke: #60a5fa }
      .output { fill: #052e16; stroke: #4ade80 }
      .outside { fill: #2a2410; stroke: #facc15 }
      .warn { fill: #2b1416; stroke: #f87171 }
      .flow { stroke: #cbd5e1 }
      .back { stroke: #64748b }
      .tip { fill: #cbd5e1 }
      .tipBack { fill: #64748b }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="tip" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="tipBack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="tipBack" d="M 0 0 L 10 5 L 0 10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="684"/>
  <text class="title" x="24" y="49">機能網羅（kitchen_sink）の画面と遷移</text>
  <text class="caption" x="24" y="68">段は「メニューから開ける画面 → そこから遷移で開く画面」。線は遷移の向き（札はボタン名）。箱の中は誰が開けるか。</text>
  <text class="caption" x="24" y="96">メニューから開ける画面 5 枚 / 全部で 6 枚</text>
  <text class="caption" x="24" y="132">内訳: 1件の入力: 1 / 照会（読み取り専用）: 1 / マスタ保守: 1 / 1件の照会: 1 / 段階入力: 1 / 帳票: 1</text>
  <rect class="box input" x="24" y="154" width="273.3" height="88" rx="8"/>
  <text class="label" x="160.7" y="184" text-anchor="middle">条件の組み合わせ</text>
  <text class="note" x="160.7" y="203" text-anchor="middle">combo_form</text>
  <text class="body body" x="38.0" y="228">・ 誰でも開ける</text>
  <rect class="box input" x="313.3333333333333" y="154" width="273.3" height="88" rx="8"/>
  <text class="label" x="450.0" y="184" text-anchor="middle">選択肢の連動</text>
  <text class="note" x="450.0" y="203" text-anchor="middle">linked_master</text>
  <text class="body body" x="327.3" y="228">・ 誰でも開ける</text>
  <rect class="box input" x="602.6666666666666" y="154" width="273.3" height="88" rx="8"/>
  <text class="label" x="739.3" y="184" text-anchor="middle">ステップ入力</text>
  <text class="note" x="739.3" y="203" text-anchor="middle">steps_wizard</text>
  <text class="body body" x="616.7" y="228">・ 誰でも開ける</text>
  <rect class="box input" x="24" y="252" width="273.3" height="88" rx="8"/>
  <text class="label" x="160.7" y="282" text-anchor="middle">帳票（降順）</text>
  <text class="note" x="160.7" y="301" text-anchor="middle">sorted_report</text>
  <text class="body body" x="38.0" y="326">・ 誰でも開ける</text>
  <rect class="box input" x="313.3333333333333" y="252" width="273.3" height="88" rx="8"/>
  <text class="label" x="450.0" y="282" text-anchor="middle">押す前に聞く</text>
  <text class="note" x="450.0" y="301" text-anchor="middle">press_list</text>
  <text class="body body" x="327.3" y="326">・ 誰でも開ける</text>
  <path class="flow link" d="M 450.0 350 V 370.0 H 160.7 V 392" marker-end="url(#tip)"/>
  <text class="edge" x="305.3" y="366.0" text-anchor="middle">詳細</text>
  <rect class="box core" x="24" y="392" width="273.3" height="88" rx="8"/>
  <text class="label" x="160.7" y="422" text-anchor="middle">畳み込み</text>
  <text class="note" x="160.7" y="441" text-anchor="middle">fold_detail</text>
  <text class="body body" x="38.0" y="466">・ 誰でも開ける</text>
  <text class="caption" x="24" y="504">線にできなかった遷移（同じ段の中・戻り・行が離れているもの）:</text>
  <text class="caption" x="24" y="540">  畳み込み → 押す前に聞く（一覧へ戻る） / ステップ入力 → 押す前に聞く（やめる）</text>
  <text class="caption" x="24" y="576">すべての画面がメニューか遷移からたどれる。</text>
  <text class="caption" x="24" y="612">出てくる役割: admin / tester</text>
  <text class="caption" x="24" y="648">`--role &lt;役割&gt;` を付けると、その役割で通れる道だけの図になる。</text>
</svg>
