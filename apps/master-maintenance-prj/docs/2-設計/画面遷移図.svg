<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 514" width="900" height="514" role="img" aria-label="社内マスタ（master_maintenance）の画面と遷移">
  <style>
    .bg { fill: #ffffff }
    text { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; fill: #0f172a }
    .title { font-size: 19px; font-weight: 700 }
    .caption { font-size: 13px; fill: #64748b }
    .label { font-size: 15px; font-weight: 600 }
    .note { font-size: 13px; fill: #64748b }
    .body { font-size: 13px; fill: #334155 }
    .edge { font-size: 13px; fill: #475569 }
    .strong { font-weight: 700 }
    .good { fill: #15803d }
    .bad { fill: #b91c1c }
    .box { stroke-width: 1.5 }
    .core { fill: #f1f5f9; stroke: #475569 }
    .input { fill: #eff6ff; stroke: #2563eb }
    .output { fill: #f0fdf4; stroke: #16a34a }
    .outside { fill: #fefce8; stroke: #ca8a04; stroke-dasharray: 5 4 }
    .warn { fill: #fef2f2; stroke: #dc2626 }
    .flow { stroke: #475569; stroke-width: 2 }
    .link { fill: none; stroke-width: 1.6 }
    .back { stroke: #94a3b8 }
    .tip { fill: #475569 }
    .tipBack { fill: #94a3b8 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220 }
      text { fill: #e2e8f0 }
      .caption, .note { fill: #94a3b8 }
      .body { fill: #cbd5e1 }
      .edge { fill: #cbd5e1 }
      .good { fill: #4ade80 }
      .bad { fill: #f87171 }
      .core { fill: #172033; stroke: #94a3b8 }
      .input { fill: #172554; stroke: #60a5fa }
      .output { fill: #052e16; stroke: #4ade80 }
      .outside { fill: #2a2410; stroke: #facc15 }
      .warn { fill: #2b1416; stroke: #f87171 }
      .flow { stroke: #cbd5e1 }
      .back { stroke: #64748b }
      .tip { fill: #cbd5e1 }
      .tipBack { fill: #64748b }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="tip" d="M 0 0 L 10 5 L 0 10 z"/></marker>
    <marker id="tipBack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="tipBack" d="M 0 0 L 10 5 L 0 10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="900" height="514"/>
  <text class="title" x="24" y="49">社内マスタ（master_maintenance）の画面と遷移</text>
  <text class="caption" x="24" y="68">段は「メニューから開ける画面 → そこから遷移で開く画面」。線は遷移の向き（札はボタン名）。箱の中は誰が開けるか。</text>
  <text class="caption" x="24" y="96">メニューから開ける画面 3 枚 / 全部で 4 枚</text>
  <text class="caption" x="24" y="132">内訳: 検索＋一覧＋登録・修正・削除: 2 / 1件の照会: 1 / マスタ保守: 1</text>
  <rect class="box input" x="24" y="154" width="273.3" height="88" rx="8"/>
  <text class="label" x="160.7" y="184" text-anchor="middle">部署マスタ</text>
  <text class="note" x="160.7" y="203" text-anchor="middle">department_master</text>
  <text class="body body" x="38.0" y="228">・ 誰でも開ける</text>
  <rect class="box input" x="313.3333333333333" y="154" width="273.3" height="88" rx="8"/>
  <text class="label" x="450.0" y="184" text-anchor="middle">取引先マスタ</text>
  <text class="note" x="450.0" y="203" text-anchor="middle">supplier_master</text>
  <text class="body body" x="327.3" y="228">・ 誰でも開ける</text>
  <rect class="box input" x="602.6666666666666" y="154" width="273.3" height="88" rx="8"/>
  <text class="label" x="739.3" y="184" text-anchor="middle">社員マスタ</text>
  <text class="note" x="739.3" y="203" text-anchor="middle">employee_master</text>
  <text class="body body" x="616.7" y="228">・ 誰でも開ける</text>
  <path class="flow link" d="M 739.3 252 V 272.0 H 160.7 V 294" marker-end="url(#tip)"/>
  <text class="edge" x="450.0" y="268.0" text-anchor="middle">詳細</text>
  <rect class="box core" x="24" y="294" width="273.3" height="88" rx="8"/>
  <text class="label" x="160.7" y="324" text-anchor="middle">社員詳細</text>
  <text class="note" x="160.7" y="343" text-anchor="middle">employee_detail</text>
  <text class="body body" x="38.0" y="368">・ 誰でも開ける</text>
  <text class="caption" x="24" y="406">すべての画面がメニューか遷移からたどれる。</text>
  <text class="caption" x="24" y="442">出てくる役割: admin / hr</text>
  <text class="caption" x="24" y="478">`--role &lt;役割&gt;` を付けると、その役割で通れる道だけの図になる。</text>
</svg>
