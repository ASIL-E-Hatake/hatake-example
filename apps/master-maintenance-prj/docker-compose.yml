# 社内マスタメンテナンスを丸ごと動かす。
#
#   docker compose up
#
# Flutter SDK も Node も要らない。入っているのは Docker だけでいい。

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hatake
      POSTGRES_PASSWORD: hatake
      POSTGRES_DB: master_maintenance
      # 日本語を含むので、照合順序を明示しておく（並べ替えの結果が環境で変わらないように）。
      LANG: ja_JP.utf8
    ports:
      - "5432:5432"
    volumes:
      # 初期データは**毎回入れ直す**（見本なので、消えて困るものを置かない）。
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatake -d master_maintenance"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      # 定義（../definitions）も持ち込むので、文脈は案件の根。
      context: .
      dockerfile: node-src/Dockerfile
    environment:
      PGHOST: db
      PGUSER: hatake
      PGPASSWORD: hatake
      PGDATABASE: master_maintenance
      # 見本なので固定。**本番で固定の合言葉を使わない**。
      TOKEN_SECRET: example-only-do-not-use-in-production
    ports:
      - "3000:3000"
    volumes:
      # 定義は image にも焼き込んである（配るときのため）が、**動かしている間は
      # ここを見る**。定義を直したら `docker compose restart api` だけで効く
      # ＝「画面を直すには定義を差し替えるだけ」が手元でもそのまま本当になる。
      # （焼き込みだけにしていたら、定義を直したのに古いままで試験が落ちた。）
      - ./definitions:/app/definitions:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    # Flutter Web をビルドして nginx で配る。**利用者に Flutter SDK は要らない。**
    # 1回目のビルドは数分かかる（SDK が重いので）。2回目からは速い。
    build:
      context: .
      dockerfile: flutter-src/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
